version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      lint-format:
        patterns:
          [
            "eslint*",
            "@eslint/*",
            "typescript-eslint",
            "prettier*",
            "@commitlint/*",
            "lint-staged",
            "husky",
          ]
      testing:
        patterns:
          [
            "vitest",
            "@vitest/*",
            "@playwright/test",
            "@axe-core/*",
            "@testing-library/*",
            "jsdom",
            "@lhci/*",
          ]
      other:
        patterns: ["*"]
    ignore:
      # CLAUDE.md §2: ESLint stays on v9 until react, jsx-a11y and import plugins support v10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
