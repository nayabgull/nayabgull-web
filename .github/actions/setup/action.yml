name: Setup
description: Node 24 + pnpm with store cache + frozen-lockfile install
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v5
      with:
        node-version: 24.22.1
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
